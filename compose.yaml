version: "3.9"

services:
  mongodb:
    image: docker.io/library/mongo:latest
    container_name: mongodb
    restart: unless-stopped

    ports:
      - "27017:27017"

    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123

    volumes:
      - mongodb_data:/data/db

volumes:
  mongodb_data: